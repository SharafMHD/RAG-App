services:
  # FastAPI application
  fastapi:
    build: 
      context: ..
      dockerfile: docker/rag-app/Dockerfile
    container_name: fastapi
    networks:
      - backend
    ports:
      - "8000:8000"
    volumes:
      - fastapi_data:/app/assets
    restart:
      always
    depends_on:
      pgvector:
        condition: service_healthy
    env_file:
      - ./env/.env.app
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/v1/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
   # Celery Worker
  celery-worker:
    build:
      context: ..
      dockerfile: docker/rag-app/Dockerfile
    container_name: celery-worker
    volumes:
      - fastapi_data:/app/assets
    networks:
      - backend
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      pgvector:
        condition: service_healthy
    env_file:
      - ./env/.env.app
    command: ["python", "-m", "celery", "-A", "celery_app", "worker", "--queues=default,file_processing_queue,data_indexing_queue,log_retention_queue", "--loglevel=info"]
    healthcheck:
      test: ["CMD-SHELL", "python -m celery -A celery_app inspect ping --timeout=5 >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: ..
      dockerfile: docker/rag-app/Dockerfile
    container_name: celery-beat
    volumes:
      - fastapi_data:/app/assets
      - celery_beat_data:/app/celerybeat
    networks:
      - backend
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ./env/.env.app
    command: ["python", "-m", "celery", "-A", "celery_app", "beat", "--loglevel=info"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'celery.*beat' >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Flower Dashboard
  flower:
    build:
      context: ..
      dockerfile: docker/rag-app/Dockerfile
    container_name: flower
    ports:
      - "5555:5555"
    networks:
      - backend
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      celery-worker:
        condition: service_healthy
    env_file:
      - ./env/.env.app
    command: ["python", "-m", "celery", "-A", "celery_app", "flower", "--conf=FlowerConfig.py"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5555 >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Ngnix reverse proxy
  nginx:
    image: nginx:stable
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      fastapi:
        condition: service_healthy
    networks:
      - backend
    restart: always
  # Postgres PG vector database
  pgvector:
    image: pgvector/pgvector:0.8.2-pg18-trixie
    container_name: pgvector
    ports:
      - "5400:5432"
    volumes:
      - 'pgvector:/var/lib/postgresql'
    env_file:
      - ./env/.env.postgres
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-rag_app_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  #Qdrant DB
  qdrant:
    image: qdrant/qdrant:v1.18.2
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - 'qdrant_data:/qdrant/storage'
    networks:
      - backend
    restart: always

  #Prometheus Metrics
  prometheus:
    image: prom/prometheus:v3.12.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - 'prometheus_data:/prometheus'
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - backend
    restart: always
    command: 
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/console_templates'
      - '--web.enable-lifecycle'

  #grafana Dashboard
  grafana:
    image: grafana/grafana:11.6.15
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - 'grafana_data:/var/lib/grafana'
    env_file:
      - ./env/.env.grafana
    depends_on:
      - prometheus
    networks:
      - backend
    restart: always

  #Node exporter for system metrics
  node_exporter:
    image: prom/node-exporter:v1.11.1
    container_name: node_exporter
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs '
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($|/)'
    networks:
      - backend
    restart: always
  #postgres exporter for postgres metrics
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.19.1
    container_name: postgres_exporter
    ports:
      - "9187:9187"
    env_file:
      - ./env/.env.postgres-exporter
    depends_on:
      - pgvector
    networks:
      - backend
    restart: always
  # RabitMQ for message brokering
  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672" #AMQP port
      - "15672:15672" #Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq 
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf
    env_file:
      - ./env/.env.rabbitmq
    networks:
      - backend
    restart:
      always
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      timeout: 30s
      retries: 5
      start_period: 30s

  # REDIS for celery result backend
  redis:
    image: redis:8.2.7
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    env_file:
      - ./env/.env.redis
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-RAG_APP_PWD}\" ping | grep -q PONG"]
      timeout: 30s
      retries: 5
      start_period: 30s
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD:-RAG_APP_PWD}\""]
  # Initialize a dedicated Langfuse database inside the existing PGVector/Postgres instance
  langfuse-db-init:
    image: postgres:18-trixie
    container_name: langfuse-db-init
    networks:
      - backend
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      PGPASSWORD: admin
    command: >
      sh -c 'createdb -h pgvector -U postgres langfuse || true'
    restart: "no"

  # Langfuse observability stack using the existing Postgres and Redis services
  langfuse-worker:
    image: docker.io/langfuse/langfuse-worker:3
    container_name: langfuse-worker
    restart: always
    env_file:
      - ./env/.env.langfuse
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:3030:3030"
    networks:
      - backend
    environment: &langfuse-env
      NEXTAUTH_URL: http://localhost:3001
      DATABASE_URL: postgresql://postgres:admin@pgvector:5432/langfuse
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: RAG_APP_PWD
      REDIS_TLS_ENABLED: false
      CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
      CLICKHOUSE_URL: http://langfuse-clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: false
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: true
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:9092
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: true
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
      LANGFUSE_S3_BATCH_EXPORT_ENABLED: false
      LANGFUSE_S3_BATCH_EXPORT_BUCKET: langfuse
      LANGFUSE_S3_BATCH_EXPORT_PREFIX: exports/
      LANGFUSE_S3_BATCH_EXPORT_REGION: auto
      LANGFUSE_S3_BATCH_EXPORT_ENDPOINT: http://langfuse-minio:9000
      LANGFUSE_S3_BATCH_EXPORT_EXTERNAL_ENDPOINT: http://localhost:9092
      LANGFUSE_S3_BATCH_EXPORT_ACCESS_KEY_ID: minio
      LANGFUSE_S3_BATCH_EXPORT_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_BATCH_EXPORT_FORCE_PATH_STYLE: true

  langfuse-web:
    image: docker.io/langfuse/langfuse:3
    container_name: langfuse-web
    restart: always
    env_file:
      - ./env/.env.langfuse
    depends_on:
      langfuse-db-init:
        condition: service_completed_successfully
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "3001:3000"
    networks:
      - backend
    environment:
      <<: *langfuse-env
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://$$(hostname):3000/api/public/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  langfuse-clickhouse:
    image: docker.io/clickhouse/clickhouse-server
    container_name: langfuse-clickhouse
    restart: always
    env_file:
      - ./env/.env.langfuse
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    networks:
      - backend
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 1s

  langfuse-minio:
    image: cgr.dev/chainguard/minio
    container_name: langfuse-minio
    restart: always
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    ports:
      - "9092:9000"
      - "127.0.0.1:9093:9001"
    volumes:
      - langfuse_minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 1s
      timeout: 5s
      retries: 5
      start_period: 1s

networks:
  backend:
    driver: bridge

volumes:
  fastapi_data:
  pgvector:
  qdrant_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
  redis_data:
  celery_beat_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data: